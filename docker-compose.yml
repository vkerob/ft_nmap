services:
  ft_nmap_test:
    image: alpine:latest
    container_name: ft_nmap_container
    networks:
      test_net:
        ipv4_address: 192.168.100.10
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "apk add --no-cache tcpdump net-tools vim bash curl && tail -f /dev/null"
    cap_add:
      - NET_RAW
    privileged: true

networks:
  test_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
